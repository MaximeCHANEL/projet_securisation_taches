name: Tests PHP

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  tests:
    runs-on: ubuntu-latest

    # Variables utilisées uniquement pour les tests
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: secure_tasks_test
      DB_USERNAME: test_user
      DB_PASSWORD: test_password

    # Base de données MySQL utilisée pendant les tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: secure_tasks_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # 1. Récupération du projet
      - name: Récupérer le code
        uses: actions/checkout@v4

      # 2. Installation de PHP
      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql
          coverage: none

      # 3. Installation des dépendances PHP
      - name: Installer les dépendances
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      # 4. Attendre que MySQL soit disponible
      - name: Vérifier MySQL
        run: |
          mysqladmin ping \
            -h 127.0.0.1 \
            -P 3306 \
            -u test_user \
            -ptest_password \
            --wait

      # 5. Création des tables de la base de test
      - name: Initialiser la base de données de test
        run: |
          mysql \
            -h 127.0.0.1 \
            -P 3306 \
            -u test_user \
            -ptest_password \
            secure_tasks_test < db_test/init.sql

      # 6. Vérification de la configuration PHPUnit
      - name: Vérifier les tests PHPUnit
        working-directory: backend
        run: vendor/bin/phpunit -c phpunit.xml --list-tests

      # 7. Exécution des tests
      - name: Exécuter les tests PHPUnit
        working-directory: backend
        run: vendor/bin/phpunit -c phpunit.xml