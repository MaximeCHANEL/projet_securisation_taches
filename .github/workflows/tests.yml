name: Tests PHP

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: secure_tasks_test
      DB_USERNAME: test_user
      DB_PASSWORD: test_password

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: secure_tasks_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql
          coverage: xdebug

      - name: Installer les dépendances
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Vérifier les dépendances
        working-directory: backend
        run: |
          pwd
          ls -la
          ls -la vendor
          ls -la vendor/bin || true

      - name: Vérifier MySQL
        run: |
          mysqladmin ping \
            -h 127.0.0.1 \
            -P 3306 \
            -u test_user \
            -ptest_password \
            --wait

      - name: Initialiser la base de données de test
        run: |
          mysql \
            -h 127.0.0.1 \
            -P 3306 \
            -u test_user \
            -ptest_password \
            secure_tasks_test < db_test/init.sql

      # ...

      - name: Exécuter le test avec coverage
        working-directory: backend
        run: vendor/bin/phpunit -c phpunit.xml --filter testUserCannotModifyAnotherUsersTask --coverage-text

      - name: Exécuter les tests PHPUnit
        working-directory: backend
        run: vendor/bin/phpunit -c phpunit.xml

  deploy:
    needs: tests          # attend que le job "tests" ait réussi
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /chemin/vers/ton/projet
            git pull origin main
            docker-compose down
            docker-compose up -d --build