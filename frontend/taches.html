<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

    <title>Mes tâches - Task Manager</title>
</head>

<body>

    <div class="container">

        <div class="topbar">
            <div class="wordmark">
                Mes tâches
                <small>Task Manager — carnet personnel</small>
            </div>

            <button class="logout" id="logoutButton">
                Se déconnecter
            </button>
        </div>

        <div class="card">

            <h2>Ajouter une tâche</h2>

            <form id="taskForm">

                <div class="field">
                    <label for="titre">Titre</label>
                    <input
                        type="text"
                        id="titre"
                        placeholder="Ex. Préparer la présentation"
                        required
                    >
                </div>

                <div class="field">
                    <label for="description">Description</label>
                    <textarea id="description" placeholder="Détails, contexte, échéance..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit">
                        Ajouter
                    </button>
                </div>

            </form>

            <p id="message"></p>

        </div>

        <hr>

        <div class="task-section-head">
            <h2 style="border:none; margin:0; padding:0;">Liste des tâches</h2>
        </div>

        <div id="tasksList">
            Chargement...
        </div>

    </div>

    <!-- JavaScript chargé après le HTML -->
    <script src="js/taches.js"></script>

</body>
</html>
