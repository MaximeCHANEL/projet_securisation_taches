<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

    <title>Connexion - Task Manager</title>
</head>

<body>

    <div class="container container--narrow">

        <p class="eyebrow">Task Manager</p>

        <div class="card">

            <h1>Connexion</h1>
            <p class="subtitle">Accéder à votre carnet</p>

            <form id="loginForm">

                <div class="field">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="vous@exemple.fr"
                        required
                    >
                </div>

                <div class="field">
                    <label for="password">Mot de passe</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required
                    >
                </div>

                <div class="form-actions">
                    <button type="submit">
                        Se connecter
                    </button>

                    <button type="button" id="registerButton">
                        S'inscrire
                    </button>
                </div>

            </form>

            <p id="message"></p>

        </div>

    </div>

    <!-- JS chargé après le HTML -->
    <script src="js/login.js"></script>

</body>
</html>
