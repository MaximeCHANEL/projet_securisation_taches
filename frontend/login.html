<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

    <title>Connexion - Task Manager</title>
</head>

<body>

    <h1>Connexion</h1>

    <form id="loginForm">

        <div>
            <label for="email">Email :</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </div>

        <br>

        <div>
            <label for="password">Mot de passe :</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>

        <br>

        <button type="submit">
            Se connecter
        </button>

        <button type="button" id="registerButton">
            S'inscrire
        </button>

    </form>

    <p id="message"></p>

    <!-- JS chargé après le HTML -->
    <script src="js/login.js"></script>

</body>
</html>
